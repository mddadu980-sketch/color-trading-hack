<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trading Hack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Color Trading Hack</h1>
            <p>Find and highlight similar colors in trading charts</p>
        </header>

        <div class="control-panel">
            <div class="section">
                <label for="colorPicker">Select Target Color:</label>
                <input type="color" id="colorPicker" value="#FF5733">
                <span id="colorValue">#FF5733</span>
            </div>

            <div class="section">
                <label for="tolerance">Tolerance Level (±):</label>
                <input type="range" id="tolerance" min="0" max="100" value="30">
                <span id="toleranceValue">30</span>
            </div>

            <div class="section">
                <button id="uploadBtn" class="btn btn-primary">Upload Chart Image</button>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>

            <div class="section">
                <button id="processBtn" class="btn btn-success">Process & Find Colors</button>
                <button id="clearBtn" class="btn btn-danger">Clear</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="canvas-wrapper">
                <h3>Original Chart</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="canvas-wrapper">
                <h3>Highlighted Results</h3>
                <canvas id="resultCanvas"></canvas>
            </div>
        </div>

        <div class="stats-panel">
            <h3>📊 Statistics</h3>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">Total Pixels Matched:</span>
                    <span class="value" id="pixelsMatched">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Match Percentage:</span>
                    <span class="value" id="matchPercentage">0%</span>
                </div>
                <div class="stat-item">
                    <span class="label">Unique Colors Found:</span>
                    <span class="value" id="uniqueColors">0</span>
                </div>
            </div>
        </div>

        <div class="results-panel">
            <h3>🎯 Matched Colors</h3>
            <div id="resultsList" class="results-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
